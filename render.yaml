services:
  # ── Backend API (Node.js / Express + MongoDB) ─────────────────────────────
  - type: web
    name: genetic-medicine-backend
    runtime: node
    rootDir: backend
    # Install ALL deps (including typescript/tsx) then compile to dist/
    buildCommand: npm install && ./node_modules/.bin/tsc
    startCommand: node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: https://prerna2434.github.io
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
