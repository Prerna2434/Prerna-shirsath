services:
  # ── Backend API (Node.js / Express + MongoDB) ─────────────────────────────
  - type: web
    name: genetic-medicine-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: https://prerna2434.github.io
      - key: MONGODB_URI
        sync: false   # Add real value in Render dashboard → Environment
      - key: GEMINI_API_KEY
        sync: false   # Add real value in Render dashboard → Environment (leave blank for offline fallback)
