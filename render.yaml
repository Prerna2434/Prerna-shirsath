services:
  # ── Backend API (Node.js / Express + MongoDB) ─────────────────────────────
  - type: web
    name: genetic-medicine-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node_modules/.bin/tsx src/server.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: https://prerna2434.github.io
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
