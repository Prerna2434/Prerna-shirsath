<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>GeneticMedicine</title>
    <script>
      // GitHub Pages SPA redirect trick.
      // When a deep link like /Prerna-shirsath/some-path is requested,
      // GitHub Pages serves this 404.html instead of a real 404.
      // We encode the path into the query string and redirect to the root,
      // where the main index.html picks it up and restores the URL.
      var l = window.location;
      var segmentCount = 1; // number of path segments in the repo base (1 for /Prerna-shirsath)
      var p = l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' +
              l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
              (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
              l.hash;
      l.replace(p);
    </script>
  </head>
  <body></body>
</html>
